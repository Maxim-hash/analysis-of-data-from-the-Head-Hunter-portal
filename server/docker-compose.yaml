services:
 analysis-postgres:
  image: postgres:18.4-bookworm
  container_name: analysis-env-postgres
  environment:
    - POSTGRES_USER: ${POSTGRES_USER}
    - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    - POSTGRES_DB: ${POSTGRES_DB}
  volume:
    - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
  restart: always
